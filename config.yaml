# Pipeline configuration.
# Every parameter marked "recovered" comes from the original QGIS processing history
# (%APPDATA%/QGIS/QGIS3/profiles/default/user-history.db) or from inspecting the
# reference rasters; see docs/qgis_workflow.md. Edit paths for your machine.

paths:
  # Raw inputs (read-only, never modified by the pipeline)
  raw_root: "D:/Vyom/GEOTA/Bhopal_STP_Project/01_Raw_Data"
  sentinel_granule: "D:/Vyom/GEOTA/Bhopal_STP_Project/01_Raw_Data/Sentinel_2/S2B_MSIL2A_20250609T051649_N0511_R062_T43QGF_20250609T075016.SAFE/GRANULE/L2A_T43QGF_A043131_20250609T053024/IMG_DATA"
  dem: "D:/Vyom/GEOTA/Bhopal_STP_Project/01_Raw_Data/DEM/AP_04940_FBS_F0450_RT1.dem.tif"
  boundary: "D:/Vyom/GEOTA/Bhopal_STP_Project/01_Raw_Data/Vectors/Planning_Boundary_2031.geojson"
  vectors_raw: "D:/Vyom/GEOTA/Bhopal_STP_Project/01_Raw_Data/Vectors"
  # QGIS outputs used as the parity reference (read-only)
  reference_rasters: "D:/Vyom/GEOTA/Bhopal_STP_Project/02_Processed_Layers/Raster_Data"
  reference_vectors: "D:/Projects/GEOTA/Final Project/Vector_Data"
  reference_queries: "D:/Projects/GEOTA/Final Project/Raster_Data"
  reference_dashboard: "D:/Projects/GEOTA/Final Project/STP_Dashboard"
  # Pipeline outputs (git-ignored)
  output: "outputs"

crs: "EPSG:32643"  # WGS 84 / UTM 43N (recovered)

sentinel:
  tile: "T43QGF"
  date: "2025-06-09"
  # Stack order (recovered from Sentinel_Stack.vrt): band index -> Sentinel-2 band
  bands: ["B02", "B03", "B04", "B08", "B11"]
  b11_resampling: "nearest"  # 20 m -> 10 m in the VRT (RESAMPLING=0, recovered)
  # Processing baseline N0511 stores reflectance as (DN + BOA_ADD_OFFSET) / 10000 (MTD_MSIL2A.xml).
  boa_offset: -1000

indices:
  # QGIS used raw DN (verified: NDBI matches raw DN to 1.5e-8, differs by up to 0.30 with the
  # offset). The pipeline applies the offset; the parity check recomputes without it.
  apply_boa_offset: true

# The three grids the QGIS outputs live on (recovered from reference rasters).
grids:
  sentinel_10m:   # Raster_01, NDBI, K-Means, Reclass_ML_LULC, Final suitability map
    origin: [727980.0, 2592280.0]
    res: 10.0
    shape: [3658, 3769]   # rows, cols
  proximity_10m:  # Raster_05..08 distance rasters and their reclasses
    origin: [727972.3125, 2592280.25]
    res: 10.0
    shape: [3658, 3770]
  dem_12_5m:      # DEM, slope, NDVI, MNDWI and their reclasses
    origin: [727972.3125, 2592280.25]
    res: 12.5
    shape: [2926, 3016]

dem:
  resampling: "bilinear"  # gdal:warpreproject RESAMPLING=1 (recovered)
  nodata: 0

slope:
  algorithm: "horn"   # ZEVENBERGEN=False (recovered)
  units: "degrees"

proximity:
  # Clip -> rasterise (burn=1) on proximity_10m -> distance in metres -> NoData outside (recovered)
  layers:
    roads:
      raw: "Roads_Bhopal"
      qgis_clip: "Roads_Bhopal_Clipped"
      reference: "Raster_05_Dist_Roads_Clipped.tif"
    drainage:
      raw: "Natural_Drainage_Bhopal"
      qgis_clip: "Natural_Drainage_Clipped"
      reference: "Raster_06_Dist_Drainage_Clipped.tif"
    residential:
      raw: "Landuse_Residential_Bhopal"
      qgis_clip: "Landuse_Residential_Bhopal_Clipped"
      reference: "Raster_07_Dist_Residential_Clipped.tif"
    water:
      raw: "Natural_Water_Bhopal"
      qgis_clip: "Lakes_Bhopal_Clipped"
      reference: "Raster_08_Dist_Water_Clipped.tif"

lulc:
  n_clusters: 5
  random_state: 42
  batch_size: 2048
  # K-Means class -> suitability score (recovered reclass table). Class 2 was the
  # out-of-boundary void because the original NoData mask never matched.
  reclass: {1: 2, 2: null, 3: 10, 4: 3, 5: 1}
  # 3b corrected model (chosen 2026-10-20 from the evidence in docs/parity.md, Phase 3):
  # void masked, k=4, full K-Means with restarts on a fixed 1M-pixel sample.
  corrected:
    k: 4
    n_init: 10
    random_state: 42
    fit_size: 1000000
    sample_seed: 0
    # Same meanings as the original reclass table (o3 barren 10, o4 built-up 3,
    # o1 vegetation 2, o5 water/dark 1).
    scores: {barren: 10, built_up: 3, vegetation: 2, water: 1}
  # 3b: evidence for choosing k on the void-masked stack (see stp.lulc.k_selection)
  k_selection:
    ks: [2, 3, 4, 5, 6, 7, 8]
    seeds: [42, 0, 1]
    fit_size: 1000000
    eval_size: 20000

standardize:
  # Recovered exactly (docs/parity.md, Phase 4): round the input to whole numbers, map the
  # layer's own [min, max] linearly onto [1, 10], round half up; "invert" = 11 - x.
  # source: pipeline output (relative to paths.output); reference: QGIS Reclass_* raster.
  roads:
    invert: true
    source: "phase2/dist_roads.tif"
    reference: "Reclass_05_Dist_Roads.tif"
  drainage:
    invert: true
    source: "phase2/dist_drainage.tif"
    reference: "Reclass_06_Dist_Drainage.tif"
  residential:
    invert: false
    source: "phase2/dist_residential.tif"
    reference: "Reclass_07_Dist_Residential.tif"
  water:
    invert: false
    source: "phase2/dist_water.tif"
    reference: "Reclass_08_Dist_Water.tif"
  dem:
    invert: true
    source: "phase1/dem.tif"
    reference: "Reclass_09_DEM.tif"
  slope:
    invert: true
    source: "phase1/slope.tif"
    reference: "Reclass_10_Slope.tif"

weights:  # from the report's Raster Calculator expression (not logged in history)
  residential: 0.25
  water: 0.20
  drainage: 0.15
  slope: 0.12
  roads: 0.10
  lulc: 0.10
  dem: 0.08

selection:
  suitability_min: 8.0       # Query 1
  # Exact ties (score == 8.0: 2,417 px original, 4,740 corrected) pass deterministically
  threshold_tolerance: 1.0e-6
  lulc_required: 10          # Query 2 (barren)
  roads_score_min: 7         # Query 3
  polygonize_connectivity: 4 # EIGHT_CONNECTEDNESS=False (recovered)
  buffer_m: 500              # schools + hospitals (recovered)
  buffer_segments: 30        # (recovered)
  min_area_sqm: 5000
  # QGIS $area = ellipsoidal (WGS84) area, stored rounded to whole m2 (verified 47/47)
  # Original order was area filter -> difference; the pipeline uses difference -> area filter.
  exclusion_layers: ["Schools_Bhopal", "Hospital_Bhopal"]

parity:  # reference numbers the pipeline is checked against
  final_sites: 46
  final_area_sqm: 1254202
  suitability_range: [3.06, 8.48]  # full-resolution read; 3.42 was a 4x-subsampled estimate

sensitivity:
  # Monte Carlo: each weight x U(1 - delta, 1 + delta), renormalised; full selection rerun.
  draws: 300
  delta: 0.2
  seed: 0
  # One-at-a-time: each weight x (1 +/- oat_delta), others rescaled proportionally.
  oat_delta: 0.2
  # A site is "persistent" in a draw if at least this share of its pixels is selected.
  persistence_cover: 0.5
  # Sites persistent in at least this share of draws are flagged robust.
  robust_threshold: 0.75

network:
  # Drivable OSM network for the boundary plus this margin (one Overpass request, then
  # cached as outputs/phase6/drive_network.graphml).
  boundary_buffer_m: 1000

threshold:
  # Phase 6e: compare threshold rules under the same random weight draws.
  # top_pct 0.3395 matches the share of pixels the fixed >= 8 rule selects (27,519 px).
  rules:
    - {kind: fixed, value: 8}
    - {kind: top_pct, pct: 0.25}
    - {kind: top_pct, pct: 0.3395}
    - {kind: top_pct, pct: 0.5}
  draws: 100
  seed: 1
  # Robust core: pixels selected in at least this share of the sensitivity draws.
  robust_core: [0.75, 0.9]

ahp:
  # Pairwise judgements (with reasons); the questionnaire is generated from this file.
  judgements_file: "ahp_judgements.yaml"
  # Threshold rules under which to compare the AHP weights with the original weights.
  evaluate_rules:
    - {kind: fixed, value: 8}
    - {kind: top_pct, pct: 0.3395}

model:
  # The FINAL model, decided with the author on 2026-10-20 (`--model final`, the default
  # for the Phase 6 commands). Phases 1-5 keep the original QGIS setup for parity.
  weights: ahp                     # from ahp_judgements.yaml (approved)
  threshold: {kind: top_pct, pct: 0.3395}
  # Residential distance is scored only up to this separation, flat beyond. 100 m is the
  # CPHEEO Manual on Sewerage and Sewage Treatment Systems (2013, Part A, ch. 5) odour
  # buffer for plants without deodorisation, as quoted in a CPCB reply to the NGT.
  residential_cap_m: 100
  # Minimum site area = mean plant capacity x land per MLD.
  # 12.7 MLD: mean of the six AMRUT 2.0 Package 3 plants (32, 14, 13, 10, 6, 1 MLD;
  #   Indian Infrastructure, 2025-01-27).
  # 0.044 ha/MLD: MBR 4.5 MLD on 2,000 m2 (Delhi), the largest of three measured Indian
  #   plants (SBR 3 MLD on 700 m2 = 0.023; MBBR 1 MLD on 400 m2 = 0.040); Saxena,
  #   "Assessment of latest technological solutions in wastewater treatment", SuSanA.
  #   Upper end chosen for margin (sludge handling, expansion). -> 0.56 ha (5,588 m2).
  plant_capacity_mld: 12.7
  land_ha_per_mld: 0.044

crosscheck:
  # Independent evidence per final site (stp.crosscheck); not ground truth.
  esri_io_year: 2023               # latest Esri/IO annual map on Planetary Computer
  dynamic_world_date: "2025-06-09" # same Sentinel-2 scene as the analysis
  ee_project: "auto-stp-bhopal"    # Earth Engine project (user's)
  chip_pad_m: 300                  # context around each site in the visual chips
