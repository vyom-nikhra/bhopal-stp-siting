name: stp
channels:
  - conda-forge
dependencies:
  - python=3.12
  # raster
  - gdal
  - libgdal-jp2openjpeg  # JPEG 2000 driver for the Sentinel-2 .jp2 bands (separate on conda-forge)
  - rasterio
  - rioxarray
  - xarray
  - numpy
  - scipy
  - rasterstats
  # vector
  - geopandas
  - pyogrio
  - shapely
  - pyproj
  - pyarrow
  - osmnx
  # analysis / ML
  - scikit-learn
  # viz and apps
  - matplotlib
  - streamlit
  - folium
  - streamlit-folium
  - plotly
  - fastapi
  - uvicorn
  - earthengine-api
  # tooling
  - pyyaml
  - ipykernel
  - pytest
  - ruff
  - pip
  - pip:
      - -e .
variables:
  # Ignore packages in the per-user site directory (e.g. %APPDATA%\Python\Python312),
  # which otherwise shadow this environment's packages.
  PYTHONNOUSERSITE: "1"
