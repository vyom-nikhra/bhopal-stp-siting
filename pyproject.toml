[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stp"
version = "0.1.0"
description = "Multi-criteria site suitability for decentralised sewage treatment plants in Bhopal"
requires-python = ">=3.12"
authors = [{ name = "Vyom Nikhra" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["needs_data: requires the local raw/reference data from config.yaml"]
# Tests fit K-Means on a few hundred points (one chunk), which triggers sklearn's
# Windows/MKL memory-leak warning; real runs use millions of pixels and many chunks.
filterwarnings = [
    "ignore:MiniBatchKMeans is known to have a memory leak:UserWarning",
    # rioxarray 0.23 and rasterstats 0.21 still use `transform * coords` (deprecated in affine 3).
    "ignore:Use `@` matmul instead:PendingDeprecationWarning:rioxarray",
    "ignore:Use `@` matmul instead:PendingDeprecationWarning:rasterstats",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
